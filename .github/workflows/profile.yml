name: Profile

# Redraws the stats and project cards from live GitHub data and publishes them
# to the `output` branch, which the README loads its images from.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: generator/go.mod
          cache: false

      - name: Test the generator
        working-directory: generator
        run: go test ./...

      - name: Render cards
        working-directory: generator
        env:
          # Optional: a PROFILE_TOKEN secret (a classic token with read:user)
          # makes the numbers include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: go run . -out ../dist -assets ../assets -readme ../README.md

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#00955f&color_dots=#ebedf0,#b3ecd3,#63d6a6,#1fb07c,#00955f
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ffa3&color_dots=#161b22,#0b3b2b,#0d6446,#10a06f,#00ffa3

      - name: Publish cards to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Render profile cards"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Commit README and artwork changes
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "README and artwork are up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(profile): refresh generated sections"
          git pull --rebase origin main
          git push origin HEAD:main
